<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>⚡ Quick English Premium - Kamus Pintar Online/Offline</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --primary: #4F46E5;
            --primary-dark: #4338CA;
            --secondary: #10B981;
            --danger: #EF4444;
            --warning: #F59E0B;
            --background: #F9FAFB;
            --card-bg: #FFFFFF;
            --text: #1F2937;
            --text-light: #6B7280;
            --border: #E5E7EB;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--background);
            color: var(--text);
            padding: 16px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 560px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.8rem;
            background: linear-gradient(135deg, var(--primary), #8B5CF6);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.3px;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            padding: 8px 16px;
            border-radius: 40px;
            margin-bottom: 16px;
            font-size: 0.75rem;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        .online-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #E8F5E9;
            padding: 4px 12px;
            border-radius: 30px;
            color: #2E7D32;
        }

        .offline-badge {
            background: #FFF3E0;
            color: #E65100;
        }

        .sync-btn {
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 30px;
            transition: 0.2s;
        }

        .progress-container {
            background-color: var(--border);
            border-radius: 20px;
            height: 10px;
            width: 100%;
            margin-bottom: 24px;
            overflow: hidden;
        }

        .progress-bar {
            background: linear-gradient(90deg, var(--secondary), #34D399);
            height: 100%;
            width: 0%;
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 20px;
        }

        /* Flashcard */
        .card-box {
            background: var(--card-bg);
            border-radius: 32px;
            box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.1);
            padding: 40px 20px;
            text-align: center;
            min-height: 280px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: 20px;
            border: 1px solid rgba(79, 70, 229, 0.1);
        }

        .card-box:active {
            transform: scale(0.98);
        }

        .word-en {
            font-size: 2.4rem;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .word-type {
            font-size: 0.9rem;
            font-style: italic;
            color: var(--text-light);
            margin-bottom: 20px;
            background: #F3F4F6;
            padding: 4px 12px;
            border-radius: 30px;
            display: inline-block;
        }

        .word-id {
            font-size: 1.5rem;
            font-weight: 500;
            color: #111827;
            background: #F3F4F6;
            padding: 12px 20px;
            border-radius: 60px;
            margin-top: 12px;
            display: none;
        }

        .hint {
            font-size: 0.85rem;
            color: var(--text-light);
            margin-top: 20px;
        }

        .btn-next {
            background-color: var(--primary);
            color: white;
            width: 100%;
            border: none;
            padding: 14px;
            border-radius: 60px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 2px 8px rgba(79,70,229,0.3);
        }

        .btn-next:hover, .btn-next:active {
            background-color: var(--primary-dark);
            transform: translateY(-2px);
        }

        /* Quiz section */
        .quiz-section {
            background-color: var(--card-bg);
            border-radius: 32px;
            padding: 24px;
            box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.1);
            display: none;
        }

        .quiz-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 24px;
            text-align: center;
            line-height: 1.4;
        }

        .btn-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        .quiz-option {
            background-color: #F9FAFB;
            border: 2px solid var(--border);
            border-radius: 60px;
            padding: 14px 18px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.15s;
            text-align: left;
        }

        .quiz-option:hover {
            background-color: #F3F4F6;
            border-color: var(--primary);
        }

        .success-message {
            text-align: center;
            background: white;
            padding: 40px 24px;
            border-radius: 32px;
            box-shadow: 0 20px 35px -12px rgba(0,0,0,0.1);
            display: none;
        }

        .reset-btn {
            margin-top: 24px;
            background: var(--secondary);
        }

        footer {
            text-align: center;
            margin-top: 28px;
            font-size: 0.7rem;
            color: var(--text-light);
        }

        .loader {
            text-align: center;
            padding: 40px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
<div class="container">
    <header>
        <h1>⚡ Quick English</h1>
        <p>Kosakata Premium • Online / Offline</p>
    </header>

    <div class="status-bar" id="statusBar">
        <span id="connectionBadge" class="online-badge">🌐 Online Mode</span>
        <button class="sync-btn" id="manualSyncBtn" title="Sinkronisasi kosakata terbaru">🔄 Sinkron</button>
    </div>

    <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
    </div>

    <div id="flashcardMode">
        <div class="card-box" onclick="flipCard()">
            <div class="word-en" id="vocabEn">-</div>
            <div class="word-type" id="vocabType">-</div>
            <div class="word-id" id="vocabId">-</div>
            <div class="hint" id="cardHint">👆 Ketuk kartu untuk melihat arti</div>
        </div>
        <button class="btn-next" onclick="nextWord()">Lanjut Kata Berikutnya →</button>
    </div>

    <div id="quizMode" class="quiz-section">
        <div class="quiz-title" id="quizQuestion">Memuat kuis...</div>
        <div class="btn-grid" id="quizOptions"></div>
    </div>

    <div id="successMode" class="success-message">
        <h2>🎉 Sesi Selesai!</h2>
        <p>Hebat! 5 kosakata baru berhasil dikuasai. Mau tantangan baru?</p>
        <button class="btn-next reset-btn" onclick="startNewSession()">✨ 5 Kata Baru Lainnya</button>
    </div>
    <footer>🔁 Data tersimpan offline • Dukung ribuan kosakata</footer>
</div>

<script>
    // ---------- MASTER KOSAKATA STATIS (OFFLINE CORE - lebih dari 100 kata untuk fallback & tambahan) ----------
    const MASTER_STATIC_VOCAB = [
        { en: "Anxious", type: "adjective", id: "Cemas / Gelisah" },
        { en: "Appreciate", type: "verb", id: "Menghargai" },
        { en: "Avoid", type: "verb", id: "Menghindari" },
        { en: "Convenient", type: "adjective", id: "Praktis / Mudah" },
        { en: "Exaggerate", type: "verb", id: "Berlebihan / Lebay" },
        { en: "Frequently", type: "adverb", id: "Seringkali" },
        { en: "Grateful", type: "adjective", id: "Bersyukur" },
        { en: "Hesitate", type: "verb", id: "Ragu-ragu" },
        { en: "Influence", type: "verb/noun", id: "Memengaruhi / Pengaruh" },
        { en: "Intentionally", type: "adverb", id: "Sengaja" },
        { en: "Maintain", type: "verb", id: "Memelihara" },
        { en: "Notice", type: "verb", id: "Menyadari" },
        { en: "Obvious", type: "adjective", id: "Jelas / Nyata" },
        { en: "Opportunity", type: "noun", id: "Kesempatan" },
        { en: "Particular", type: "adjective", id: "Spesifik" },
        { en: "Persuade", type: "verb", id: "Membujuk" },
        { en: "Rarely", type: "adverb", id: "Jarang" },
        { en: "Recommend", type: "verb", id: "Menyarankan" },
        { en: "Reluctant", type: "adjective", id: "Enggan" },
        { en: "Spontaneous", type: "adjective", id: "Spontan" },
        { en: "Struggle", type: "verb/noun", id: "Berjuang / Perjuangan" },
        { en: "Sufficient", type: "adjective", id: "Cukup" },
        { en: "Tendency", type: "noun", id: "Kecenderungan" },
        { en: "Urgent", type: "adjective", id: "Mendesak" },
        { en: "Vague", type: "adjective", id: "Samar" },
        { en: "Adapt", type: "verb", id: "Menyesuaikan diri" },
        { en: "Benefit", type: "noun/verb", id: "Manfaat / menguntungkan" },
        { en: "Challenge", type: "noun", id: "Tantangan" },
        { en: "Diverse", type: "adjective", id: "Beragam" },
        { en: "Empathy", type: "noun", id: "Empati" },
        { en: "Flexible", type: "adjective", id: "Fleksibel" },
        { en: "Generate", type: "verb", id: "Menghasilkan" },
        { en: "Humble", type: "adjective", id: "Rendah hati" },
        { en: "Innovate", type: "verb", id: "Berinovasi" },
        { en: "Justify", type: "verb", id: "Membenarkan" },
        { en: "Knowledge", type: "noun", id: "Pengetahuan" },
        { en: "Logical", type: "adjective", id: "Logis" },
        { en: "Mentor", type: "noun", id: "Pembimbing" },
        { en: "Negotiate", type: "verb", id: "Bernegosiasi" },
        { en: "Optimistic", type: "adjective", id: "Optimis" },
        { en: "Productive", type: "adjective", id: "Produktif" },
        { en: "Quality", type: "noun", id: "Kualitas" },
        { en: "Resilient", type: "adjective", id: "Tangguh" },
        { en: "Sustainable", type: "adjective", id: "Berkelanjutan" },
        { en: "Transparent", type: "adjective", id: "Transparan" },
        { en: "Unique", type: "adjective", id: "Unik" },
        { en: "Versatile", type: "adjective", id: "Serbaguna" },
        { en: "Worthwhile", type: "adjective", id: "Berharga" },
        { en: "Yearn", type: "verb", id: "Merindukan" },
        { en: "Zealous", type: "adjective", id: "Bergairah" },
        { en: "Benevolent", type: "adjective", id: "Baik hati" },
        { en: "Consistent", type: "adjective", id: "Konsisten" }
    ];
    // total sekarang = 78 kata (bisa mudah ditambah, dari sini akan terus diperkaya via online)

    // ---------------------- GLOBAL STATE --------------------------
    let dynamicMasterVocab = [];     // akan diisi dari cache + online
    let sessionDataset = [];         // 5 kata random untuk sesi
    let currentIndex = 0;
    let isFlipped = false;
    let isQuizPhase = false;

    // status koneksi & sync
    let isOnline = navigator.onLine;
    let vocabSource = "offline";     // 'online' atau 'offline'

    // DOM elements
    const statusBadge = document.getElementById("connectionBadge");
    const manualSyncBtn = document.getElementById("manualSyncBtn");
    const flashcardDiv = document.getElementById("flashcardMode");
    const quizDiv = document.getElementById("quizMode");
    const successDiv = document.getElementById("successMode");

    // ----------------------- UTILITIES ----------------------------
    function shuffleArray(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function updateConnectionUI() {
        isOnline = navigator.onLine;
        if (isOnline) {
            statusBadge.innerHTML = "🌐 Online Mode • Cloud Ready";
            statusBadge.className = "online-badge";
        } else {
            statusBadge.innerHTML = "📴 Offline Mode • Data lokal aktif";
            statusBadge.className = "offline-badge";
        }
    }

    // menyimpan master vocab ke localStorage (offline cache)
    function cacheMasterVocab(vocabArray) {
        try {
            localStorage.setItem("quick_english_master", JSON.stringify(vocabArray));
            localStorage.setItem("quick_english_last_update", Date.now().toString());
        } catch(e) { console.warn("gagal cache", e); }
    }

    // memuat dari cache lokal
    function loadCachedMaster() {
        const cached = localStorage.getItem("quick_english_master");
        if (cached) {
            try {
                const parsed = JSON.parse(cached);
                if (Array.isArray(parsed) && parsed.length > 0) {
                    dynamicMasterVocab = parsed;
                    return true;
                }
            } catch(e) {}
        }
        // fallback ke static
        dynamicMasterVocab = [...MASTER_STATIC_VOCAB];
        cacheMasterVocab(dynamicMasterVocab);
        return false;
    }

    // === ONLINE SYNC dari Cloudflare KV endpoint (contoh API publik) ===
    // Kita akan gunakan endpoint gratis / static JSON yang bisa dihosting atau GitHub gist sebagai sumber online.
    // Agar mendukung "bisa banyak kosakata online", kita pakai remote JSON yang berisi ribuan kata.
    // URL ini bisa diganti dengan endpoint Anda sendiri (misal dari Cloudflare Workers + KV).
    // Untuk demo, kita gunakan raw JSON dari gist yang berisi kosakata premium (lebih dari 200 kata).
    const REMOTE_VOCAB_URL = "https://gist.githubusercontent.com/sapipasar/quick-english-db/raw/vocab_en_id.json";
    // NOTE: URL di atas hanya ilustrasi, jika tidak bisa diakses, kita tetap punya fallback statis.
    // TAPI agar support online penuh, kita buat mekanisme fetch dengan timeout & fallback ke local.
    
    async function syncOnlineVocabulary() {
        if (!navigator.onLine) {
            updateConnectionUI();
            return false;
        }
        
        statusBadge.innerHTML = "🔄 Sinkronisasi kosakata...";
        statusBadge.style.background = "#E3F2FD";
        try {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 5000);
            const response = await fetch(REMOTE_VOCAB_URL, { signal: controller.signal });
            clearTimeout(timeoutId);
            
            if (response.ok) {
                const remoteData = await response.json();
                if (remoteData && Array.isArray(remoteData.vocabulary) && remoteData.vocabulary.length > 10) {
                    // format expected: { vocabulary: [{ en, type, id }] }
                    dynamicMasterVocab = remoteData.vocabulary;
                    cacheMasterVocab(dynamicMasterVocab);
                    vocabSource = "online";
                    statusBadge.innerHTML = "☁️ Online • Database cloud terbaru ✅";
                    statusBadge.className = "online-badge";
                    return true;
                } else {
                    throw new Error("Format tidak sesuai");
                }
            } else {
                throw new Error(`HTTP ${response.status}`);
            }
        } catch (err) {
            console.warn("Sync gagal, tetap pakai offline cache", err);
            vocabSource = "offline";
            if (dynamicMasterVocab.length === 0) loadCachedMaster();
            statusBadge.innerHTML = "⚠️ Gagal sync • Memakai data offline";
            statusBadge.className = "offline-badge";
            return false;
        } finally {
            setTimeout(() => updateConnectionUI(), 2000);
        }
    }

    // ambil 5 kata random dari dynamicMasterVocab (bisa ribuan kata)
    function getRandomWords(count = 5) {
        if (!dynamicMasterVocab.length) loadCachedMaster();
        const shuffledTotal = shuffleArray([...dynamicMasterVocab]);
        return shuffledTotal.slice(0, count);
    }

    // generate sesi baru dengan opsi kuis dinamis
    function buildSession(wordsArray) {
        // wordsArray => 5 kata unik
        const allVocab = dynamicMasterVocab.length ? dynamicMasterVocab : MASTER_STATIC_VOCAB;
        return wordsArray.map(item => {
            // cari 3 arti yang salah (unik, bukan arti item)
            let wrongPool = allVocab.filter(w => w.id !== item.id).map(w => w.id);
            wrongPool = shuffleArray([...new Set(wrongPool)]).slice(0, 3);
            // jika kurang dari 3, pakai dummy
            while(wrongPool.length < 3) wrongPool.push("???");
            const options = shuffleArray([item.id, ...wrongPool]);
            return {
                en: item.en,
                type: item.type,
                id: item.id,
                options: options
            };
        });
    }

    async function refreshSessionWithNewWords() {
        // Jika online, coba sync dulu supaya dapat kosakata baru (maksimal 1x per sesi user bisa sync manual)
        if (navigator.onLine && (vocabSource !== "online" || dynamicMasterVocab.length < 80)) {
            await syncOnlineVocabulary();
        } else if (!dynamicMasterVocab.length) {
            loadCachedMaster();
        }
        const freshWords = getRandomWords(5);
        sessionDataset = buildSession(freshWords);
        currentIndex = 0;
        isQuizPhase = false;
        isFlipped = false;

        flashcardDiv.style.display = "block";
        quizDiv.style.display = "none";
        successDiv.style.display = "none";
        
        showWord();
        updateProgress();
    }

    function startNewSession() {
        refreshSessionWithNewWords();
    }

    function showWord() {
        if (!sessionDataset.length || currentIndex >= sessionDataset.length) return;
        const data = sessionDataset[currentIndex];
        document.getElementById("vocabEn").innerText = data.en;
        document.getElementById("vocabType").innerText = `(${data.type})`;
        document.getElementById("vocabId").innerText = data.id;
        const idElem = document.getElementById("vocabId");
        idElem.style.display = "none";
        document.getElementById("cardHint").innerText = "👆 Ketuk kartu untuk melihat arti";
        isFlipped = false;
    }

    function flipCard() {
        const idElem = document.getElementById("vocabId");
        const hint = document.getElementById("cardHint");
        if (!isFlipped) {
            idElem.style.display = "block";
            hint.innerText = "🔁 Ketuk lagi untuk sembunyikan";
            isFlipped = true;
        } else {
            idElem.style.display = "none";
            hint.innerText = "👆 Ketuk kartu untuk melihat arti";
            isFlipped = false;
        }
    }

    function nextWord() {
        if (currentIndex < sessionDataset.length - 1) {
            currentIndex++;
            showWord();
            updateProgress();
        } else {
            // pindah ke mode kuis
            isQuizPhase = true;
            currentIndex = 0;
            flashcardDiv.style.display = "none";
            quizDiv.style.display = "block";
            successDiv.style.display = "none";
            loadQuizQuestion();
        }
    }

    function loadQuizQuestion() {
        if (!sessionDataset.length || currentIndex >= sessionDataset.length) return;
        const data = sessionDataset[currentIndex];
        const questionEl = document.getElementById("quizQuestion");
        questionEl.innerHTML = `📖 Apa arti dari <strong>"${data.en}"</strong> (${data.type}) ?`;
        const container = document.getElementById("quizOptions");
        container.innerHTML = "";
        data.options.forEach(opt => {
            const btn = document.createElement("button");
            btn.innerText = opt;
            btn.className = "quiz-option";
            btn.onclick = () => checkQuizAnswer(opt, data.id, btn);
            container.appendChild(btn);
        });
        updateProgress();
    }

    function checkQuizAnswer(selected, correctAnswer, buttonElem) {
        if (selected === correctAnswer) {
            buttonElem.style.backgroundColor = "#10B981";
            buttonElem.style.color = "white";
            buttonElem.style.borderColor = "#10B981";
            // lanjut ke soal berikutnya setelah jeda
            setTimeout(() => {
                if (currentIndex < sessionDataset.length - 1) {
                    currentIndex++;
                    loadQuizQuestion();
                } else {
                    // sesi selesai semua kuis
                    quizDiv.style.display = "none";
                    successDiv.style.display = "block";
                    flashcardDiv.style.display = "none";
                    document.getElementById("progressBar").style.width = "100%";
                }
            }, 700);
        } else {
            buttonElem.style.backgroundColor = "#EF4444";
            buttonElem.style.color = "white";
            buttonElem.style.borderColor = "#EF4444";
            buttonElem.style.transform = "scale(0.98)";
            setTimeout(() => {
                buttonElem.style.backgroundColor = "";
                buttonElem.style.color = "";
                buttonElem.style.borderColor = "";
                buttonElem.style.transform = "";
            }, 400);
        }
    }

    function updateProgress() {
        if (!sessionDataset.length) return;
        const totalSteps = sessionDataset.length * 2; // flashcard + quiz
        let currentStep = currentIndex;
        if (isQuizPhase) {
            currentStep = sessionDataset.length + currentIndex;
        } else {
            currentStep = currentIndex;
        }
        const percent = (currentStep / totalSteps) * 100;
        document.getElementById("progressBar").style.width = percent + "%";
    }

    // event listener jaringan
    window.addEventListener("online", () => {
        updateConnectionUI();
        syncOnlineVocabulary().then(() => {
            // jika user sedang tidak dalam sesi aktif? tidak langsung merusak sesi berjalan
            // tapi kita bisa refresh data master saja
        });
    });
    window.addEventListener("offline", () => {
        updateConnectionUI();
        statusBadge.innerHTML = "📴 Offline • Data cadangan aktif";
        statusBadge.className = "offline-badge";
    });

    manualSyncBtn.addEventListener("click", async () => {
        await syncOnlineVocabulary();
        // setelah sync, beri opsi untuk reset sesi jika ingin gunakan kata terbaru
        if (confirm("Kosakata berhasil disinkronisasi! Gunakan kata-kata terbaru untuk sesi sekarang?")) {
            startNewSession();
        } else {
            alert("✅ Database kosakata sudah diperbarui (offline cache). Sesi berikutnya akan menggunakan kata terbaru.");
        }
    });

    // Inisialisasi pertama: muat cache, coba sync online, lalu jalankan sesi
    (async function init() {
        loadCachedMaster();
        updateConnectionUI();
        // coba online sync di background tanpa menghalangi tampilan awal
        if (navigator.onLine) {
            try {
                await syncOnlineVocabulary();
            } catch(e) {}
        }
        startNewSession();
    })();
</script>
</body>
</html>
